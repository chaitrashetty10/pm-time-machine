<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14171f">
<title>PM Time Machine: practice real product decisions</title>
<style>
:root{--bg:#f4f1ea;--fg:#14171f;--mut:#5a5f68;--card:#fff;--line:#ddd8cc;--acc:#a85d00;--btn:#14171f;--btnfg:#f4f1ea;--good:#1b7f5c;--bad:#b3392b;--hero:#14171f;--herofg:#f4f1ea}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171f;--fg:#f4f1ea;--mut:#b8bcc6;--card:#1f2430;--line:#333a4a;--acc:#f2a33a;--btn:#f2a33a;--btnfg:#14171f;--good:#4fc9a0;--bad:#ff8a7a;--hero:#1f2430;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Arial,Helvetica,sans-serif;line-height:1.5}
header{display:flex;align-items:center;justify-content:space-between;max-width:900px;margin:0 auto;padding:16px 20px;position:sticky;top:0;background:var(--bg);z-index:20;border-bottom:1px solid var(--line)}
main{max-width:560px;margin:0 auto;padding:14px 20px 84px}
.ib{width:42px;height:42px;border-radius:50%;border:0;background:var(--card);color:var(--fg);font-size:20px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.ttl{font-family:Georgia,serif;font-weight:700;font-size:18px;cursor:pointer}
.card,.how div,.g,.opt,.sc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin:12px 0;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.hero{background:linear-gradient(135deg,#1c2233,#2d2447);color:#f4f1ea;border-radius:24px;padding:36px 28px;margin:8px 0 20px}
.go{background:var(--btn);color:var(--btnfg);border:0;border-radius:14px;padding:14px 22px;font-weight:700;font-size:16px;cursor:pointer;margin:8px 8px 0 0}
.ghost{background:transparent;color:var(--fg);border:2px solid var(--line)}
.gauges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.g{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.gv{font-size:26px;font-weight:700;margin:2px 0 6px}
.track{height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.fill{height:100%;background:var(--acc)}
.opt{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;color:var(--fg);border:2px solid var(--line);border-radius:14px;padding:16px 18px;margin:10px 0;background:var(--card);cursor:pointer}
.opt i{flex:none;width:34px;height:34px;border-radius:50%;background:var(--btn);color:var(--btnfg);font-style:normal;font-weight:700;display:grid;place-items:center}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line)}
#tabs .in{display:flex;max-width:560px;margin:0 auto}
#tabs button{flex:1;background:none;border:0;padding:8px 2px 10px;color:var(--mut);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
#tabs button span{font-size:22px}#tabs button.on{color:var(--acc);font-weight:700}
.mut{color:var(--mut)}
</style></head>
<body>
<header>
  <button id="bk" class="ib" onclick="tab('cases')" style="display:none">←</button>
  <span id="ttl" class="ttl" onclick="tab('home')">⏳ PM Time Machine</span>
  <button class="ib" onclick="document.documentElement.toggleAttribute('data-theme')">◐</button>
</header>
<main id="app"></main>
<nav id="tabs"><div class="in">
  <button data-t="home" onclick="tab('home')"><span>🏠</span>Home</button>
  <button data-t="cases" onclick="tab('cases')"><span>📚</span>Cases</button>
  <button data-t="ins" onclick="tab('ins')"><span>📊</span>Progress</button>
  <button data-t="about" onclick="tab('about')"><span>ℹ️</span>About</button>
</div></nav>
<script>
var S={step:"home",sc:0,a:null,b:null,m:[50,50,50],path:[]};
var SC=[
  {
    name:"The Macintosh Launch Crisis", era:"Personal computing era", ic:"💻",
    r1:{t:"Launch is seven days away", d:"An advanced feature crashes in 15% of test sessions. What do you do?", o:[
      {k:"A", t:"Ship everything", d:"Preserve scope, accept reliability risk.", e:[-5,-15,10], r:"You hit the date. Crashes start showing up in the field.", alt:"The bold launch makes headlines."},
      {k:"B", t:"Cut the feature", d:"Protect core experience.", e:[5,10,-5], r:"You ship a stable core. Power users notice what is missing.", alt:"Product ships as a dependable tool."},
      {k:"C", t:"Delay the launch", d:"Prioritize reliability.", e:[-10,20,0], r:"The product gets fixed, but partners are unhappy.", alt:"Launch slips a season."}
    ]},
    r2:{
      A:{t:"Support tickets are surging", d:"Early buyers report crashes.", o:[{t:"Hotfix sprint", d:"Fix first.", e:[10,15,-10], r:"Team burns out, trust recovers."}]},
      B:{t:"Power users want the feature", d:"Competitor announced similar.", o:[{t:"Ship in 6 weeks", d:"Plan properly.", e:[10,10,-10], r:"Update lands well."}]},
      C:{t:"The window is closing", d:"Partners are impatient.", o:[{t:"Limited release", d:"Learn from real use.", e:[10,5,5], r:"Enthusiasts forgive rough edges."}]}
    }
  }
];

function reset(){S={step:"home",sc:0,a:null,b:null,m:[50,50,50],path:[]}}
function tab(t){S.step=t;draw()}
function start(i){S.sc=i;S.step="brief";draw()}
function bars(e){return '<div class="gauges">'+['Customer trust','Product quality','Team morale'].map(function(x,i){var d=e?e[i]:0;return '<div class="g"><div class="mut">'+x+'</div><div class="gv">'+S.m[i]+(d?' <span style="color:'+(d>0?'green':'red')+'">'+(d>0?'+':'')+d+'</span>':'')+'</div><div class="track"><div class="fill" style="width:'+S.m[i]+'%"></div></div></div>'}).join('')+'</div>'}
function opts(r,fn){return r.o.map(function(o,i){return '<button class="opt" onclick="'+fn+'('+i+')"><i>'+(i+1)+'</i><span><b>'+o.t+'</b><span class="mut">'+o.d+'</span></span></button>'}).join('')}

async function coach(){
  var el=document.getElementById("ai");
  if(!el)return;
  el.innerHTML="Getting a live AI take on your choices...";
  try{
    var r=await fetch("/api/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message:"Review my PM choices. Trust: "+S.m[0], choiceHistory:S})
    });
    var j=await r.json();
    el.innerHTML="<b>Live AI Coach:</b> "+(j.reply||j.text||"Good job!");
  }catch(e){
    el.innerHTML="AI Coach is temporarily unavailable.";
  }
}

function draw(){
  var A=document.getElementById("app"),h="",s=S.step,C=SC[S.sc];
  if(!A)return;
  
  if(s=="home"){
    h='<div class="hero"><h1>Practice real product decisions</h1><p>Play the product manager at a turning point in tech history.</p><button class="go" onclick="start(0)">▶ Play Case Study</button></div>';
  }else if(s=="cases"){
    h='<h2>Case Studies</h2><button class="opt" onclick="start(0)"><span><b>The Macintosh Launch Crisis</b><span class="mut">Personal computing era</span></span></button>';
  }else if(s=="about"){
    h='<h2>About PM Time Machine</h2><div class="card">A free simulator for learning product management trade-offs.</div>';
  }else if(s=="ins"){
    h='<h2>Your Progress</h2><div class="card">Track your decisions and score outcomes here.</div>';
  }else if(s=="brief"){
    h='<h2>'+C.name+'</h2><div class="card"><b>Situation:</b> '+C.r1.d+'</div>'+bars()+'<button class="go" onclick="S.step=\'r1\';draw()">Start Decision 1</button>';
  }else if(s=="r1"){
    h='<h2>'+C.r1.t+'</h2><p>'+C.r1.d+'</p>'+bars()+opts(C.r1, "pick1");
  }else if(s=="r1res"){
    var o=C.r1.o[S.a];
    h='<h2>Result</h2><div class="card">'+o.r+'</div>'+bars(o.e)+'<button class="go" onclick="S.step=\'r2\';draw()">Next Challenge</button>';
  }else if(s=="r2"){
    var r=C.r2[["A","B","C"][S.a]];
    h='<h2>'+r.t+'</h2><p>'+r.d+'</p>'+bars()+opts(r, "pick2");
  }else if(s=="r2res"){
    h='<h2>Scorecard</h2>'+bars()+'<div class="card"><b>Live AI Coaching:</b><button class="go ghost" onclick="coach()">Get AI Feedback</button><p id="ai" style="margin-top:10px"></p></div><button class="go" onclick="tab(\'cases\')">Try Another Case</button>';
  }
  A.innerHTML=h;
}

function pick1(i){S.a=i;var o=SC[S.sc].r1.o[i];S.m=S.m.map(function(v,idx){return Math.max(0,Math.min(100,v+o.e[idx]))});S.path.push(o.t);S.step="r1res";draw()}
function pick2(i){S.b=i;var r=SC[S.sc].r2[["A","B","C"][S.a]];var o=r.o[i]||r.o[0];S.m=S.m.map(function(v,idx){return Math.max(0,Math.min(100,v+o.e[idx]))});S.path.push(o.t);S.step="r2res";draw()}

draw();
</script>
</body>
</html>
