<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171f;--fg:#f4f1ea;--mut:#b8bcc6;--card:#1f2430;--line:#333a4a;--acc:#f2a33a;--btn:#f2a33a;--btnfg:#14171f;--good:#4fc9a0;--bad:#ff8a7a;--hero:#1f2430;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171f;--fg:#f4f1ea;--mut:#b8bcc6;--card:#1f2430;--line:#333a4a;--acc:#f2a33a;--btn:#f2a33a;--btnfg:#14171f;--good:#4fc9a0;--bad:#ff8a7a;--hero:#1f2430;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Arial,Helvetica,sans-serif;line-height:1.5}
header{display:flex;align-items:center;justify-content:space-between;max-width:900px;margin:0 auto;padding:16px 20px}
.logo{font-family:Georgia,serif;font-weight:700;font-size:20px;cursor:pointer;background:none;border:0;color:var(--fg)}
main{max-width:900px;margin:0 auto;padding:4px 20px 56px;animation:in .3s}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.tag{font-size:12px;font-weight:700;letter-spacing:3px;color:var(--acc);text-transform:uppercase}
h1,h2{font-family:Georgia,serif;line-height:1.15;margin:8px 0 12px}h1{font-size:42px}h2{font-size:30px}
p{margin:0 0 14px}.mut{color:var(--mut)}button{font:inherit;cursor:pointer}
.hero{background:var(--hero);color:var(--herofg);border-radius:20px;padding:36px 28px;margin:8px 0 20px}
.hero p{font-size:19px;max-width:620px}.hero .tag{color:#f2a33a}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:16px 0}
.how div,.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.card{margin:12px 0}.how b{display:block;margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin:12px 0}
.sc{text-align:left;background:var(--card);color:var(--fg);border:2px solid var(--line);border-radius:16px;padding:18px}
.sc:hover,.sc:focus-visible,.opt:hover,.opt:focus-visible{border-color:var(--acc);outline:none}
.sc .ic{font-size:32px}.sc b{display:block;font-size:18px;margin:6px 0 2px}.sc small{color:var(--mut)}
.pr{height:6px;border-radius:6px;background:var(--line);margin-top:12px;overflow:hidden}.pr i{display:block;height:100%;background:var(--acc)}
.stp{display:flex;gap:6px;margin:6px 0}.stp span{flex:1;height:6px;border-radius:6px;background:var(--line)}.stp .done{background:var(--acc)}.stp .cur{background:var(--fg)}
.step{font-size:13px;color:var(--mut);margin-bottom:10px}
.gauges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.g{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}.gl{font-size:13px;color:var(--mut)}
.gv{font-size:26px;font-weight:700;margin:2px 0 6px}.track{height:8px;border-radius:8px;background:var(--line);overflow:hidden}.fill{height:100%;background:var(--acc);transition:width .6s}
.pill{font-size:12px;margin-left:8px;padding:2px 8px;border-radius:20px;border:1px solid currentColor}.up{color:var(--good)}.dn{color:var(--bad)}
.opt{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;background:var(--card);color:var(--fg);border:2px solid var(--line);border-radius:14px;padding:16px 18px;margin:10px 0}
.opt i{flex:none;width:34px;height:34px;border-radius:50%;background:var(--btn);color:var(--btnfg);font-style:normal;font-weight:700;display:grid;place-items:center}
.opt b{display:block;font-size:18px}
.go{background:var(--btn);color:var(--btnfg);border:0;border-radius:12px;padding:14px 22px;font-weight:700;font-size:16px;margin:8px 8px 0 0}
.ghost{background:transparent;color:var(--fg);border:2px solid var(--line)}
.row{display:flex;flex-wrap:wrap}.badge{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:20px;padding:3px 10px;color:var(--mut);margin:0 6px 6px 0}
.big{font-size:56px;font-weight:700;font-family:Georgia,serif}.note{font-size:13px;color:var(--mut);margin-top:28px}
@media(max-width:560px){h1{font-size:32px}.gauges{grid-template-columns:1fr}}
</style></head><body>
